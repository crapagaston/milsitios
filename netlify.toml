[build]
  publish = "."
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[headers]]
  for = "/amigo-invisible*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
[[redirects]]
  from = "/api/amigo-invisible"
  to = "/.netlify/functions/amigo-invisible"
  status = 200
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/work/*"
  to = "/404.html"
  status = 404
  force = true
